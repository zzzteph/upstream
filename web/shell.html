<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #0a1015;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Loading screen: the UPSTREAM nameplate from the main menu, on the menu's
   steel-wall colours. The blue rule under the name fills as the game loads,
   and the gauge needle rises with it. */
#status {
	position: absolute;
	inset: 0;
	background: linear-gradient(#1f2c35, #0a1015);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1.5rem;
	visibility: hidden;
	transition: opacity 0.35s ease-out;
}

#status.done {
	opacity: 0;
}

#boot-logo {
	width: min(92vw, 640px);
	height: auto;
	display: block;
}

#status-notice {
	display: none;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<svg id="boot-logo" viewBox="-6 -6 760 212" role="img" aria-label="Upstream - loading"></svg>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// The nameplate, drawn to the same measurements as the menu's (StationLogo):
// a 742 x 191 steel plate, the gauge at (78, 90), the name from x 140 on a
// 127.8 baseline, and the 558-wide blue rule under it - the progress bar.
const bootLogo = (function () {
	const NS = 'http://www.w3.org/2000/svg';
	const svg = document.getElementById('boot-logo');
	const el = (tag, attrs, parent) => {
		const e = document.createElementNS(NS, tag);
		for (const k in attrs) {
			e.setAttribute(k, attrs[k]);
		}
		(parent || svg).appendChild(e);
		return e;
	};
	const W = 742, H = 190.7, TX = 140, BASE = 127.8, TW = 558, FS = 104;
	const defs = el('defs', {});
	const pat = el('pattern', { id: 'hz', width: 14, height: 16, patternUnits: 'userSpaceOnUse', patternTransform: 'skewX(-45)' }, defs);
	el('rect', { width: 7, height: 16, fill: '#1a1a1a' }, pat);
	el('rect', { x: 7, y: 7, width: W, height: H, rx: 16, fill: 'rgba(0,0,0,0.6)' });
	el('rect', { x: 2, y: 2, width: W - 4, height: H - 4, rx: 15, fill: '#2a3640', stroke: '#11181d', 'stroke-width': 4 });
	el('line', { x1: 6, y1: 6, x2: W - 6, y2: 6, stroke: '#4a5a66', 'stroke-width': 3 });
	const band = { x: 5, y: H - 22, w: W - 10, h: 16 };
	el('rect', { x: band.x, y: band.y, width: band.w, height: band.h, fill: '#ffc928' });
	el('rect', { x: band.x, y: band.y, width: band.w, height: band.h, fill: 'url(#hz)' });
	el('rect', { x: band.x, y: band.y, width: band.w, height: band.h, fill: 'none', stroke: '#11181d', 'stroke-width': 2 });
	for (const [x, y] of [[14, 16], [W - 14, 16], [14, H - 34], [W - 14, H - 34]]) {
		el('circle', { cx: x, cy: y, r: 5, fill: '#11181d' });
		el('circle', { cx: x - 1, cy: y - 1, r: 3, fill: '#6d7f8a' });
	}
	// Gauge: a 270-degree dial, red zone at the top end.
	const cx = 78, cy = 12 + (band.y - 12) / 2, r = 36;
	const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
	const at = (a, rr) => [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr];
	el('circle', { cx: cx + 3, cy: cy + 3, r: r, fill: 'rgba(0,0,0,0.5)' });
	el('circle', { cx: cx, cy: cy, r: r, fill: '#11181d' });
	el('circle', { cx: cx, cy: cy, r: r * 0.86, fill: '#dfe6e8' });
	const rs = a0 + (a1 - a0) * 0.78;
	const [sx, sy] = at(rs, r * 0.68), [ex, ey] = at(a1, r * 0.68);
	el('path', { d: `M ${sx} ${sy} A ${r * 0.68} ${r * 0.68} 0 0 1 ${ex} ${ey}`, fill: 'none', stroke: '#e0402a', 'stroke-width': r * 0.12 });
	for (let i = 0; i <= 10; i++) {
		const a = a0 + (a1 - a0) * i / 10;
		const [x1, y1] = at(a, r * (i % 5 === 0 ? 0.56 : 0.64)), [x2, y2] = at(a, r * 0.76);
		el('line', { x1, y1, x2, y2, stroke: '#11181d', 'stroke-width': r * (i % 5 === 0 ? 0.06 : 0.035), 'stroke-linecap': 'round' });
	}
	const needle = el('line', { x1: cx, y1: cy, x2: cx, y2: cy, stroke: '#c0201a', 'stroke-width': r * 0.08, 'stroke-linecap': 'round' });
	el('circle', { cx: cx, cy: cy, r: r * 0.12, fill: '#11181d' });
	el('circle', { cx: cx - r * 0.03, cy: cy - r * 0.03, r: r * 0.05, fill: '#4a5a66' });
	// The name in stencil letters, a bridge cut across them, and the rule.
	const name = el('text', { x: TX, y: BASE, 'font-size': FS, 'font-weight': 800, fill: '#e2eef4', stroke: '#11181d', 'stroke-width': 10,
		'paint-order': 'stroke', 'stroke-linejoin': 'round', textLength: TW, lengthAdjust: 'spacingAndGlyphs',
		'font-family': "'Open Sans', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" });
	name.textContent = 'UPSTREAM';
	el('rect', { x: TX - 4, y: BASE - FS * 0.40, width: TW + 8, height: FS * 0.065, fill: '#2a3640' });
	el('rect', { x: TX, y: BASE + FS * 0.1, width: TW, height: 4, fill: 'rgba(58,180,255,0.18)' });
	const rule = el('rect', { x: TX, y: BASE + FS * 0.1, width: 0, height: 4, fill: '#3ab4ff' });
	let shown = 0, target = 0, sweep = -1;
	const setNeedle = (v) => {
		const [x2, y2] = at(a0 + (a1 - a0) * v, r * 0.7);
		needle.setAttribute('x2', x2);
		needle.setAttribute('y2', y2);
	};
	setNeedle(0.04);
	const tick = () => {
		if (sweep >= 0) {
			// Size unknown: a short segment sweeps along the rule.
			sweep = (sweep + 0.012) % 1.3;
			const x0 = Math.max(0, sweep - 0.3), x1 = Math.min(1, sweep);
			rule.setAttribute('x', TX + TW * x0);
			rule.setAttribute('width', Math.max(0, TW * (x1 - x0)));
		} else {
			shown += (target - shown) * 0.25;
			rule.setAttribute('x', TX);
			rule.setAttribute('width', TW * shown);
			setNeedle(0.04 + 0.62 * shown);
		}
		if (!svg.isConnected) {
			return;
		}
		requestAnimationFrame(tick);
	};
	requestAnimationFrame(tick);
	return {
		// p: 0..1, or null while the size isn't known.
		progress: (p) => {
			if (p === null) {
				if (sweep < 0) {
					sweep = 0;
				}
			} else {
				sweep = -1;
				target = Math.max(target, Math.min(1, p));
			}
		},
	};
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			// Let the menu draw its first frames, then fade the nameplate out.
			initializing = false;
			bootLogo.progress(1);
			setTimeout(() => {
				statusOverlay.classList.add('done');
				setTimeout(() => statusOverlay.remove(), 400);
			}, 300);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				bootLogo.progress(current > 0 && total > 0 ? current / total : null);
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
